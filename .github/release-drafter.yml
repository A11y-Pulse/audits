name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "Breaking Changes"
    labels:
      - "major"
      - "breaking"
  - title: "Features"
    labels:
      - "feature"
      - "enhancement"
      - "minor"
  - title: "Bug Fixes"
    labels:
      - "fix"
      - "bug"
      - "patch"
  - title: "Dependencies"
    labels:
      - "dependencies"
  - title: "Documentation"
    labels:
      - "documentation"
      - "docs"
change-template: "- $TITLE (@$AUTHOR) #$NUMBER"
version-resolver:
  major:
    labels:
      - "major"
      - "breaking"
  minor:
    labels:
      - "minor"
      - "feature"
      - "enhancement"
  patch:
    labels:
      - "patch"
      - "fix"
      - "bug"
  # Unlabeled PRs (including Dependabot) bump minor by default.
  default: minor
template: |
  ## What's Changed

  $CHANGES
