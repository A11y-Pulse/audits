name: Release

# Keep this filename as release.yml — npm Trusted Publisher is configured for it.
on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          # Node 22.14+ required for npm trusted publishing / OIDC.
          node-version: 22

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - run: npm ci

      - name: Clear token auth so OIDC is used
        run: npm config delete "//registry.npmjs.org/:_authToken" || true

      - name: Set package version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version

      - run: npm run build

      - name: Publish to npm
        run: npm publish
        env:
          NPM_TOKEN: ""

      - name: Sync version and changelog on main
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          git fetch origin main
          git checkout -B main origin/main
          npm version "$VERSION" --no-git-tag-version

          {
            echo "# Changelog"
            echo
            echo "## ${VERSION}"
            echo
            printf '%s\n' "$RELEASE_BODY"
            echo
            # Keep prior entries (skip the leading "# Changelog" heading).
            if [[ -f CHANGELOG.md ]]; then
              tail -n +2 CHANGELOG.md
            fi
          } > CHANGELOG.md.next
          mv CHANGELOG.md.next CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No version/changelog changes to commit"
          else
            git commit -m "Release v${VERSION}"
            git push origin main
          fi
