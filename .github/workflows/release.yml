name: Release

# Keep this filename as release.yml. npm Trusted Publisher is configured for it.
# Runs only after the CI workflow has finished for a push to main, so a commit whose lint, unit,
# integration or e2e jobs failed is never versioned or published. The trigger matches CI by its
# `name:`; renaming that workflow means updating this list too.
#
# It can also be started by hand from the default branch. That is for one case: a merge landed
# while CI was still running for the commit before it, so that commit's run was skipped below, and
# the newer commit's run opened a Version PR instead of publishing. Check that CI passed for the
# tip of main before starting it: a manual run does not wait for CI.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    # A workflow_run job checks out the tip of main (github.sha), which may be newer than the
    # commit CI just tested. Releasing only when the two match keeps untested commits out; the
    # newer commit gets its own run when its CI finishes.
    #
    # A manual run has no workflow_run context, so it is told apart by event name first, and is
    # only allowed from the default branch: started from any other ref it would version and
    # publish that ref.
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_sha == github.sha
      ) || (
        github.event_name == 'workflow_dispatch' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      )
    runs-on: ubuntu-latest
    # On the job rather than the workflow, so a skipped run cannot displace a queued release.
    concurrency: release-main
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later. Pinned so the job holding id-token: write
      # does not run whatever was published most recently; bump deliberately.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11.20.0

      - run: npm ci

      - name: Clear token auth so OIDC is used
        run: npm config delete "//registry.npmjs.org/:_authToken" || true

      - uses: changesets/action@v2
        with:
          publish-script: npm run release
          pr-title: Version packages
          commit-message: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ""
