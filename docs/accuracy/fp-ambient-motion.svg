<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="1" y="1" width="498" height="128" rx="14" fill="#ffffff" stroke="#e9ecef"/>

  <!-- unfocused: button + a spinner at 0deg -->
  <rect x="50" y="34" width="160" height="60" rx="8" fill="#fafafa" stroke="#eceff1"/>
  <rect x="74" y="50" width="68" height="28" rx="7" fill="#e9ecef" stroke="#ced4da"/>
  <text x="108" y="68" text-anchor="middle" font-size="12" fill="#343a40">Submit</text>
  <!-- spinner (arc) at angle 0 -->
  <path d="M 180 64 A 12 12 0 1 1 168 52" fill="none" stroke="#4dabf7" stroke-width="3" stroke-linecap="round"/>
  <text x="130" y="116" text-anchor="middle" font-size="12.5" font-weight="600" fill="#495057">screenshot 1</text>

  <!-- on focus: same button (no focus style), spinner rotated ~120deg -->
  <rect x="290" y="34" width="160" height="60" rx="8" fill="#fafafa" stroke="#eceff1"/>
  <rect x="314" y="50" width="68" height="28" rx="7" fill="#e9ecef" stroke="#ced4da"/>
  <text x="348" y="68" text-anchor="middle" font-size="12" fill="#343a40">Submit</text>
  <!-- spinner rotated -->
  <g transform="rotate(120 420 64)">
    <path d="M 432 64 A 12 12 0 1 1 420 52" fill="none" stroke="#4dabf7" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="370" y="116" text-anchor="middle" font-size="12.5" font-weight="600" fill="#495057">screenshot 2</text>
</svg>
