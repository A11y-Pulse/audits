<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Settings</title><style>
  body { background: #fff; font: 16px/1.5 system-ui, sans-serif; }
  :focus { outline: 3px solid #0050ff; }
  .guard { width: 1px; height: 0; padding: 0; overflow: hidden; position: fixed; top: 1px; left: 1px; }
</style></head><body>
  <!-- The sentinels focus-trap, react-focus-lock and MUI put at the edges of a modal: empty, unnamed
       elements that only exist to catch focus and hand it to a control inside the dialog. -->
  <button id="open">Open settings</button>
  <div role="dialog" aria-modal="true" aria-labelledby="title">
    <div id="guard-start" class="guard" tabindex="0" data-focus-guard="true"></div>
    <h1 id="title">Settings</h1>
    <label>Display name <input id="name"></label>
    <button id="save">Save</button>
    <button id="cancel">Cancel</button>
    <div id="guard-end" class="guard" tabindex="0" data-focus-guard="true"></div>
  </div>
  <script>
    const first = document.getElementById("name");
    document.getElementById("guard-start").addEventListener("focus", () => first.focus());
    document.getElementById("guard-end").addEventListener("focus", () => first.focus());
  </script>
</body></html>
