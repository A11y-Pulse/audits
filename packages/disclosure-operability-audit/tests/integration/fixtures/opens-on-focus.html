<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store</title>
<style>
	body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; }
	button { font: inherit; }
	.panel { display: none; }
	.panel.open { display: block; }
</style>
</head>
<body>
<nav aria-label="Main">
	<div id="packs-item">
		<button id="menu-packs" type="button" aria-expanded="false" aria-controls="packs-panel">Backpacks</button>
		<div id="packs-panel" class="panel"><a href="#day">Day packs</a></div>
	</div>
	<div id="boots-item">
		<button id="menu-boots" type="button" aria-expanded="false" aria-controls="boots-panel">Boots</button>
		<div id="boots-panel" class="panel"><a href="#hiking">Hiking boots</a></div>
	</div>
</nav>
<main><h1 id="day">Day packs</h1><h2 id="hiking">Hiking boots</h2></main>
<script>
	function bind(item, button, panel, exposeState) {
		const set = (open) => {
			document.getElementById(panel).classList.toggle("open", open);

			if (exposeState) {
				document.getElementById(button).setAttribute("aria-expanded", String(open));
			}
		};

		document.getElementById(item).addEventListener("focusin", () => set(true));
		document.getElementById(item).addEventListener("focusout", () => set(false));
	}

	bind("packs-item", "menu-packs", "packs-panel", true);
	bind("boots-item", "menu-boots", "boots-panel", false);
</script>
</body>
</html>
