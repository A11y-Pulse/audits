<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>alt text is a srcset filename</title></head>
<body>
	<picture>
		<source srcset="images/IMG_4032.svg 1x" media="(min-width: 10000px)">
		<img id="picture" src="images/a91f3c.svg" alt="IMG_4032.svg">
	</picture>
	<img id="srcset" src="images/a91f3c.svg" srcset="images/a91f3c.svg 1x, images/packed-tent.svg 2x" alt="packed-tent.svg">
</body>
</html>
