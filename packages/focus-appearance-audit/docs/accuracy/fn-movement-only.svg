<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 124" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="1" y="1" width="498" height="122" rx="14" fill="#ffffff" stroke="#e9ecef"/>

  <!-- unfocused -->
  <rect x="60" y="30" width="140" height="60" rx="8" fill="#fafafa" stroke="#eceff1"/>
  <rect x="96" y="52" width="68" height="28" rx="7" fill="#e9ecef" stroke="#ced4da"/>
  <text x="130" y="70" text-anchor="middle" font-size="12" fill="#343a40">Menu</text>
  <text x="130" y="112" text-anchor="middle" font-size="12.5" font-weight="600" fill="#495057">unfocused</text>

  <!-- on focus: shifted up; ghost shows original position -->
  <rect x="300" y="30" width="140" height="60" rx="8" fill="#fafafa" stroke="#eceff1"/>
  <rect x="336" y="52" width="68" height="28" rx="7" fill="none" stroke="#dee2e6" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="336" y="42" width="68" height="28" rx="7" fill="#e9ecef" stroke="#ced4da"/>
  <text x="370" y="60" text-anchor="middle" font-size="12" fill="#343a40">Menu</text>
  <text x="370" y="112" text-anchor="middle" font-size="12.5" font-weight="600" fill="#495057">on focus</text>
</svg>
