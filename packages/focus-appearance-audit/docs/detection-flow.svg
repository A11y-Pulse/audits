<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#868e96"/>
    </marker>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="798" rx="16" fill="#ffffff" stroke="#e9ecef"/>

  <!-- ===== Band 1: Tab focuses an element (mockup left, text right) ===== -->
  <g transform="translate(150,40) scale(1.6)">
    <rect x="0" y="0" width="210" height="132" rx="8" fill="#ffffff" stroke="#ced4da"/>
    <path d="M1,9 q0,-8 8,-8 h192 q8,0 8,8 v13 h-208 z" fill="#eef0f2"/>
    <circle cx="13" cy="11" r="2.5" fill="#ced4da"/><circle cx="23" cy="11" r="2.5" fill="#ced4da"/><circle cx="33" cy="11" r="2.5" fill="#ced4da"/>
    <rect x="46" y="6" width="150" height="11" rx="5" fill="#ffffff" stroke="#e0e0e0"/>
    <rect x="16" y="38" width="74" height="8" rx="4" fill="#dee2e6"/>
    <rect x="16" y="69" width="42" height="22" rx="4" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/>
    <text x="37" y="84" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="600">Home</text>
    <text x="64" y="84" font-size="11" fill="#868e96">About</text>
    <text x="112" y="84" font-size="11" fill="#868e96">Work</text>
    <text x="158" y="84" font-size="11" fill="#868e96">Contact</text>
    <rect x="16" y="104" width="178" height="8" rx="4" fill="#f1f3f5"/>
    <rect x="16" y="118" width="120" height="8" rx="4" fill="#f1f3f5"/>
    <rect x="150" y="40" width="48" height="20" rx="5" fill="#212529"/>
    <text x="174" y="54" text-anchor="middle" font-size="11" fill="#ffffff">Tab &#8677;</text>
  </g>
  <text x="520" y="120" font-size="20" font-weight="700" fill="#1f2937">Tab focuses each element</text>
  <text x="520" y="152" font-size="15" fill="#868e96">For every focusable element, the audit asks:</text>
  <text x="520" y="174" font-size="15" fill="#868e96">did focusing it produce a visible change?</text>

  <line x1="600" y1="270" x2="600" y2="304" stroke="#868e96" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== Band 2: Stage 1 — compare focus styles (before | after) ===== -->
  <text x="600" y="332" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2937">Stage 1 &#183; Compare focus styles</text>

  <g transform="translate(140,346)">
    <rect x="0" y="0" width="920" height="104" rx="10" fill="#fafafa" stroke="#dee2e6"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <!-- before -->
      <text x="28" y="30" font-size="12" fill="#868e96" font-family="system-ui, sans-serif">before focus</text>
      <text x="28" y="58" font-size="14" fill="#495057">background: none</text>
      <text x="28" y="80" font-size="14" fill="#495057">outline: none</text>
      <!-- transition arrow -->
      <line x1="404" y1="64" x2="452" y2="64" stroke="#adb5bd" stroke-width="1.6" marker-end="url(#arr)"/>
      <!-- after -->
      <text x="484" y="30" font-size="12" fill="#868e96" font-family="system-ui, sans-serif">on focus</text>
      <rect x="480" y="40" width="416" height="48" rx="5" fill="#e8f5e9"/>
      <text x="496" y="58" font-size="14" fill="#1b5e20">background: #eef4ff</text>
      <text x="496" y="80" font-size="14" fill="#1b5e20">outline: 2px solid #2563eb</text>
    </g>
  </g>
  <text x="600" y="478" text-anchor="middle" font-size="13" font-weight="600" fill="#1b5e20">&#10003; A watched property changed &#8594; pass ("style")</text>

  <line x1="600" y1="492" x2="600" y2="526" stroke="#868e96" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="620" y="513" font-size="12.5" fill="#868e96">if nothing changed</text>

  <!-- ===== Band 3: Stage 2 — pixel-diff fallback ===== -->
  <text x="600" y="554" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2937">Stage 2 &#183; Pixel-diff fallback</text>

  <g transform="translate(140,568)">
    <rect x="0" y="0" width="920" height="176" rx="10" fill="#fafafa" stroke="#dee2e6"/>
    <text x="28" y="32" font-size="13" fill="#495057">Screenshot the element with and without focus, then compare</text>

    <!-- focused crop -->
    <g transform="translate(28,48)">
      <rect x="0" y="0" width="272" height="100" rx="8" fill="#ffffff" stroke="#dee2e6"/>
      <ellipse cx="136" cy="50" rx="56" ry="23" fill="#4dabf7" opacity="0.55" filter="url(#glow)"/>
      <text x="136" y="56" text-anchor="middle" font-size="16" fill="#0b3d91" font-weight="600">Home</text>
    </g>
    <text x="164" y="166" text-anchor="middle" font-size="12.5" fill="#495057">focused</text>

    <!-- unfocused crop -->
    <g transform="translate(324,48)">
      <rect x="0" y="0" width="272" height="100" rx="8" fill="#ffffff" stroke="#dee2e6"/>
      <text x="136" y="56" text-anchor="middle" font-size="16" fill="#343a40">Home</text>
    </g>
    <text x="460" y="166" text-anchor="middle" font-size="12.5" fill="#495057">unfocused</text>

    <!-- diff crop -->
    <g transform="translate(620,48)">
      <rect x="0" y="0" width="272" height="100" rx="8" fill="#1b1d21"/>
      <ellipse cx="136" cy="50" rx="56" ry="23" fill="none" stroke="#ff2d95" stroke-width="3" opacity="0.9"/>
      <ellipse cx="136" cy="50" rx="40" ry="15" fill="#ff2d95" opacity="0.35"/>
      <text x="136" y="56" text-anchor="middle" font-size="16" fill="#6b7280">Home</text>
    </g>
    <text x="756" y="166" text-anchor="middle" font-size="12.5" fill="#495057">diff</text>
  </g>
  <text x="600" y="772" text-anchor="middle" font-size="13" font-weight="600" fill="#1b5e20">&#10003; Pixels differ &#8594; pass ("pixel-diff")</text>
</svg>
