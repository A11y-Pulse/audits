<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
  body { background: #fff; }
  button { outline: none; }
  button:focus { outline: 3px solid #2563eb; }
</style></head><body>
  <!-- A closed-shadow host (caught via the pixel diff, see closed-shadow.html)
       FIRST in tab order, followed by two ordinary focusable buttons with a real
       focus outline. The pixel diff disturbs focus (blur + a host re-focus that
       lands on <body>); guards that the audit still reaches the elements that
       follow it rather than aborting the page. -->
  <div id="host"></div>
  <button id="after-1">After one</button>
  <button id="after-2">After two</button>
  <script>
    const host = document.getElementById("host");
    const root = host.attachShadow({ mode: "closed" });
    root.innerHTML = `
      <style>
        button { outline: none; }
        button:focus { outline: 3px solid #2563eb; }
      </style>
      <button>Shadow button</button>
    `;
  </script>
</body></html>
