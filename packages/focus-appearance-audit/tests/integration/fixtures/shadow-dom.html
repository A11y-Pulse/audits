<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
  body { background: #fff; }
</style></head><body>
  <!-- A custom-element-style host with an open shadow root. Focusing the
       elements inside it makes document.activeElement return this host, so the
       audit must descend the shadow root to find the real focused elements. -->
  <div id="rnz-site-footer"></div>
  <script>
    const host = document.getElementById("rnz-site-footer");
    const root = host.attachShadow({ mode: "open" });
    root.innerHTML = `
      <style>
        a, button { outline: none; }
        /* No replacement focus indicator: both elements should fail. */
        a:focus, button:focus { outline: none; }
      </style>
      <a href="#one">Footer link one</a>
      <button>Footer button two</button>
    `;
  </script>
</body></html>
