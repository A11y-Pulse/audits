<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Canvas layers that take pointer events</title><style>
  body { margin: 0; background: #fff; font: 16px/1.5 system-ui, sans-serif; }
  main { padding: 0 16px; }
  a { display: block; padding: 8px; }
  a:focus { outline: 3px solid #0050ff; }
  .spacer { height: 120vh; }
  /* Nothing is ever drawn on this one, but from outside it cannot be told apart from one that is. */
  #blank { position: fixed; left: 0; top: 0; width: 100%; height: 60px; z-index: 10; }
  #chart { position: fixed; left: 0; bottom: 0; width: 100%; height: 90px; z-index: 10; }
</style></head><body>
  <main>
    <a href="#a" id="under-blank">Under the blank canvas</a>
    <div class="spacer"></div>
    <a href="#b" id="under-chart">Under the painted canvas</a>
  </main>
  <canvas id="blank" width="300" height="60" aria-hidden="true"></canvas>
  <canvas id="chart" width="300" height="90" role="img" aria-label="Sales chart"></canvas>
  <script>
    const ctx = document.getElementById("chart").getContext("2d");
    ctx.fillStyle = "#123456";
    ctx.fillRect(0, 0, 300, 90);
  </script>
</body></html>
