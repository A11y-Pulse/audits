<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Custom switch under a footer</title><style>
  body { margin: 0; background: #fff; font: 16px/1.5 system-ui, sans-serif; }
  main { padding: 0 16px; }
  a { display: block; padding: 8px; }
  a:focus { outline: 3px solid #0050ff; }
  .spacer { height: 120vh; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  .check { display: block; padding: 8px 12px; }
  #footer { position: fixed; left: 0; right: 0; bottom: 0; height: 90px; background: #111; color: #fff; z-index: 10; }
</style></head><body>
  <main>
    <a href="#a" id="first">First</a>
    <div class="spacer"></div>
    <div style="position: relative">
      <input type="checkbox" id="terms" class="sr-only"><label for="terms" class="check" id="terms-label">I accept the terms</label>
    </div>
  </main>
  <div id="footer">Footer</div>
</body></html>
