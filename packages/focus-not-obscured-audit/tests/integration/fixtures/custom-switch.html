<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Custom switch</title><style>
  body { margin: 0; background: #fff; font: 16px/1.5 system-ui, sans-serif; }
  main { padding: 0 16px; }
  a { display: block; padding: 8px; }
  a:focus { outline: 3px solid #0050ff; }
  .spacer { height: 120vh; }
  .switch { position: relative; display: inline-block; width: 56px; height: 30px; margin: 16px; }
  .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; }
  .switch .track { position: absolute; inset: 0; background: #666; border-radius: 15px; }
  .switch input:checked + .track { background: #0a7; }
  .switch input:focus + .track { outline: 3px solid #0050ff; outline-offset: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  .check { display: inline-block; padding: 8px 12px; border: 1px solid #666; margin: 16px; }
  .sr-only:focus + .check { outline: 3px solid #0050ff; }
</style></head><body>
  <main>
    <h1>Notification settings</h1>
    <label class="switch"><input type="checkbox" id="emails"><span class="track"></span></label>
    <div>
      <input type="checkbox" id="sms" class="sr-only"><label for="sms" class="check">Text messages</label>
    </div>
    <a href="#save" id="save">Save</a>
  </main>
</body></html>
