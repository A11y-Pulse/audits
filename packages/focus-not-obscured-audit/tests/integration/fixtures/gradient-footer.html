<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Gradient footer</title><style>
  body { margin: 0; background: #fff; font: 16px/1.5 system-ui, sans-serif; }
  main { padding: 0 16px; }
  a { display: block; padding: 8px; }
  a:focus { outline: 3px solid #0050ff; }
  .spacer { height: 120vh; }
  #gradient-footer {
    position: fixed; left: 0; right: 0; bottom: 0; height: 90px; z-index: 10;
    background-image: linear-gradient(90deg, #1b1b2f, #53354a);
    color: #fff;
  }
</style></head><body>
  <main>
    <a href="#a" id="first">First</a>
    <div class="spacer"></div>
    <a href="#b" id="under-gradient">Under the gradient</a>
  </main>
  <div id="gradient-footer">Call us on 0800 123 456</div>
</body></html>
