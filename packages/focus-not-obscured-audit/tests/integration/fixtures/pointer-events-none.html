<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Click-through footer</title><style>
  body { margin: 0; background: #fff; font: 16px/1.5 system-ui, sans-serif; }
  main { padding: 0 16px; }
  a { display: block; padding: 8px; }
  a:focus { outline: 3px solid #0050ff; }
  .spacer { height: 120vh; }
  #ghost-footer {
    position: fixed; left: 0; right: 0; bottom: 0; height: 80px; z-index: 10;
    background: #111; color: #fff; pointer-events: none;
  }
</style></head><body>
  <main>
    <a href="#a" id="first">First</a>
    <div class="spacer"></div>
    <a href="#b" id="under-ghost">Under the click-through footer</a>
  </main>
  <div id="ghost-footer">Free delivery on orders over $50</div>
</body></html>
