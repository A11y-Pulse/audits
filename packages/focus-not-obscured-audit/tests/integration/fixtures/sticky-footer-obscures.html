<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
  body { margin: 0; background: #fff; }
  a { outline: none; display: block; padding: 8px; }
  a:focus { outline: 3px solid #0050ff; }
  .spacer { height: 120vh; }
  #sticky-footer {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 80px;
    background: #111;
    color: #fff;
    z-index: 10;
  }
</style></head><body>
  <a href="#top" id="first">First</a>
  <div class="spacer"></div>
  <a href="#under" id="under-footer">Under footer</a>
  <div id="sticky-footer">Sticky footer</div>
</body></html>
