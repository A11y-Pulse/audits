<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>two-column-form</title>
<style>body { margin: 0; font: 16px/1.5 sans-serif; } a { display: block; padding: 8px; } .tall { height: 1200px; } form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 700px; } input { display: block; }</style></head><body>
<form>
<div><label>First name<input id="first"></label><label>Last name<input id="last"></label><label>Email<input id="email"></label></div>
<div><label>Street<input id="street"></label><label>City<input id="city"></label><label>Postcode<input id="postcode"></label></div>
</form>
</body></html>
