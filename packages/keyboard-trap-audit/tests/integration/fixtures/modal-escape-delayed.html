<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>modal-escape-delayed</title></head><body>
<a id="behind" href="#a">Behind the dialog</a>
<div id="dialog" role="dialog" aria-modal="true" aria-label="Newsletter">
	<input id="email" aria-label="Email">
	<button id="close">Close</button>
</div>
<script>
	// Escape closes the dialog 400ms later, and until then nothing on the page shows that it will:
	// no class, no animation, and the key is not cancelled.
	const dialog = document.getElementById("dialog");
	const items = [...dialog.querySelectorAll("input, button")];
	document.addEventListener("keydown", (event) => {
		if (dialog.hidden) return;
		if (event.key === "Escape") {
			setTimeout(() => { dialog.hidden = true; document.getElementById("behind").focus(); }, 400);
			return;
		}
		if (event.key !== "Tab") return;
		event.preventDefault();
		const index = items.indexOf(document.activeElement);
		items[(index + (event.shiftKey ? -1 : 1) + items.length) % items.length].focus();
	});
</script>
</body></html>
