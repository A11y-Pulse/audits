<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Weeknight dinners</title>
		<style>
			body { margin: 0; font: 16px/1.6 system-ui, sans-serif; }
			main { max-width: 760px; margin: 0 auto; padding: 16px; }
			.ad { background: #eef1f5; }
			.ad__creative { width: 728px; height: 250px; background: #c9d6e8; }
			#ad-side .ad__creative { transition: height 150ms; }
		</style>
	</head>
	<body>
		<main>
			<h1>Weeknight dinners</h1>
			<div class="ad" id="ad-top" aria-label="Advertisement"></div>
			<p>Roast the vegetables first, then use the same tray for the fish.</p>
			<div class="ad" id="ad-side" aria-label="Advertisement"></div>
			<p>Leftovers keep for two days in the fridge.</p>
		</main>
		<script>
			// Ad slots that are filled late and then resized once to the creative that won the auction:
			// the first snaps to its new height, the second eases to it.
			window.startScenario = (fillAt, resizeAt) => {
				setTimeout(() => {
					for (const slot of document.querySelectorAll(".ad")) {
						const creative = document.createElement("div");

						creative.className = "ad__creative";
						creative.textContent = "Advertisement";
						slot.append(creative);
					}
				}, fillAt);

				setTimeout(() => {
					for (const creative of document.querySelectorAll(".ad__creative")) {
						creative.style.height = "90px";
					}
				}, resizeAt);
			};
		</script>
	</body>
</html>
