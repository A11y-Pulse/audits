<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Trailhead Outfitters</title>
		<style>
			body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
			main { max-width: 760px; margin: 0 auto; padding: 16px; }
			.grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; padding: 0; }
			.grid li { list-style: none; height: 24px; background: #e4e7eb; }
			.viewport { overflow: hidden; width: 760px; height: 280px; }
			/* The slides snap from one to the next, so there is no transition for the browser to report. */
			.track { display: flex; width: 2280px; }
			.slide { flex: 0 0 760px; height: 280px; box-sizing: border-box; padding: 32px; color: #fff; background: #24523b; }
			.slide:nth-child(2) { background: #7a3b1d; }
			.slide:nth-child(3) { background: #1d4f7a; }
		</style>
	</head>
	<body>
		<main>
			<h1>Spring sale</h1>
			<div class="viewport" id="offers">
				<div class="track" id="offers-track">
					<div class="slide"><h2>Two-person tents</h2></div>
					<div class="slide"><h2>Daypacks from $49</h2></div>
					<div class="slide"><h2>Waterproof boots</h2></div>
				</div>
			</div>
			<ul class="grid" id="grid"></ul>
		</main>
		<script>
			const grid = document.getElementById("grid");

			for (let i = 0; i < 220; i++) {
				grid.append(document.createElement("li"));
			}

			// A framework hydrating: every product tile gets a class once, and nothing visible changes.
			// The carousel only starts turning afterwards.
			window.startScenario = (hydrateAt, carouselAt) => {
				setTimeout(() => {
					for (const tile of grid.children) {
						tile.classList.add("is-hydrated");
					}
				}, hydrateAt);

				const track = document.getElementById("offers-track");
				let index = 0;

				setTimeout(() => {
					setInterval(() => {
						index = (index + 1) % 3;
						track.style.transform = `translateX(${-760 * index}px)`;
					}, 200);
				}, carouselAt);
			};
		</script>
	</body>
</html>
