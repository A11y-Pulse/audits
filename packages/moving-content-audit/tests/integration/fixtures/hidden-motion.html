<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Harbour Kayak Hire</title>
		<style>
			body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
			main { max-width: 760px; margin: 0 auto; padding: 16px; }
			@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
			@keyframes pan { from { background-position: 0 0; } to { background-position: 600px 0; } }
			/* A page preloader the script hides once the page is ready; its animation never stops. */
			.preloader { position: absolute; top: 80px; left: 16px; width: 600px; height: 300px; background: #0b4f6c; animation: pulse 400ms infinite alternate; }
			.preloader.is-done { visibility: hidden; }
			.hero { position: relative; width: 600px; height: 300px; }
			.hero figure { position: absolute; inset: 0; margin: 0; background: #2a7f62 linear-gradient(90deg, #2a7f62, #9bd1a5); }
			/* The off-state slide keeps its pan animation while it is faded out. */
			.hero figure.is-off { opacity: 0; animation: pan 600ms linear infinite; }
			/* A whole panel hidden through its parent. */
			.drawer { visibility: hidden; }
			.drawer .ribbon { width: 600px; height: 300px; background: #e9c46a; animation: pulse 500ms infinite alternate; }
		</style>
	</head>
	<body>
		<main>
			<h1>Harbour Kayak Hire</h1>
			<div class="preloader is-done" id="preloader" aria-hidden="true"></div>
			<div class="hero">
				<figure id="slide-day"><figcaption>Day trips from the marina</figcaption></figure>
				<figure id="slide-night" class="is-off"><figcaption>Sunset paddles</figcaption></figure>
			</div>
			<div class="drawer" id="drawer"><div class="ribbon" id="ribbon">Members save 10%</div></div>
			<p>Open every day, 9am to 6pm.</p>
		</main>
	</body>
</html>
