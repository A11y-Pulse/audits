<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Your orders</title>
		<style>
			body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
			main { max-width: 760px; margin: 0 auto; padding: 16px; }
			.spinner { width: 48px; height: 48px; border: 4px solid #ccc; border-top-color: #333; border-radius: 50%; animation: spin 1s linear infinite; }
			.loader { width: 160px; height: 160px; border: 8px solid #ccc; border-top-color: #333; border-radius: 50%; animation: spin 1s linear infinite; }
			.order-list { width: 760px; height: 200px; background: linear-gradient(90deg, #eee 25%, #f7f7f7 50%, #eee 75%); background-size: 200% 100%; animation: sheen 1.5s linear infinite; }
			.badge { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #c00; animation: pulse 1s ease-in-out infinite; }
			@keyframes spin { to { transform: rotate(360deg); } }
			@keyframes sheen { to { background-position: -200% 0; } }
			@keyframes pulse { 50% { opacity: 0.3; transform: scale(1.3); } }
		</style>
	</head>
	<body>
		<main>
			<h1>Your orders <span class="badge" id="badge" title="New"></span></h1>
			<div role="status" id="status">
				<div class="spinner" id="spinner"></div>
				Loading your orders…
			</div>
			<div class="loader" id="map-loader"></div>
			<div class="order-list" id="orders" aria-busy="true"></div>
		</main>
	</body>
</html>
