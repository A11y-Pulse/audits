<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Service status</title>
		<style>
			body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
			main { max-width: 760px; margin: 0 auto; padding: 16px; }
			@keyframes blink { from { opacity: 1; } to { opacity: 0.2; } }
			@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
			.card { position: relative; width: 400px; height: 300px; margin-bottom: 16px; padding: 16px; box-sizing: border-box; border: 1px solid #ccd; overflow: hidden; }
			/* A ten-pixel "live" dot in the corner of a large card. */
			#live::after { content: ""; position: absolute; top: 12px; right: 12px; width: 10px; height: 10px; border-radius: 50%; background: #d33; animation: blink 300ms infinite alternate; }
			/* A sheen across the whole card, drawn by a pseudo-element as large as the card. */
			#featured::before { content: ""; position: absolute; top: 0; left: 0; width: 400px; height: 300px; background: linear-gradient(90deg, transparent, #fff8, transparent); animation: sweep 500ms linear infinite; }
			/* A typing cursor of no stated size blinking after a headline. */
			#tagline { width: 400px; height: 60px; margin: 0; }
			#tagline::after { content: "|"; animation: blink 400ms infinite alternate; }
		</style>
	</head>
	<body>
		<main>
			<h1>Service status</h1>
			<section class="card" id="live"><h2>Harbour line</h2><p>Running to timetable.</p></section>
			<section class="card" id="featured"><h2>Summer pass</h2><p>Unlimited travel until March.</p></section>
			<p id="tagline">Every line, every minute</p>
		</main>
	</body>
</html>
