<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Harbour Daily</title>
		<style>
			body { margin: 0; font: 16px/1.5 Georgia, serif; }
			main { max-width: 760px; margin: 0 auto; padding: 16px; }
			.ticker { overflow: hidden; width: 760px; height: 48px; background: #111; color: #fff; white-space: nowrap; }
			.ticker__track { display: inline-block; line-height: 48px; padding-left: 760px; animation: ticker 12s linear infinite; }
			.ticker:hover .ticker__track { animation-play-state: paused; }
			@keyframes ticker {
				to { transform: translateX(-100%); }
			}
			@media (prefers-reduced-motion: reduce) {
				.ticker__track { animation: none; padding-left: 0; }
			}
		</style>
	</head>
	<body>
		<main>
			<div class="ticker" id="headlines">
				<div class="ticker__track">
					<span>Ferry timetable changes from Monday</span>
					<span>Council approves waterfront cycleway</span>
				</div>
			</div>
			<h1>Council approves waterfront cycleway</h1>
			<p>Work on the two-kilometre route starts in spring.</p>
		</main>
	</body>
</html>
