<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>tab controlling a region</title></head>
<body>
	<div role="tablist">
		<button id="tab-a" role="tab" aria-controls="region-a">A</button>
	</div>
	<div id="region-a" role="region" aria-label="A">A</div>
	<div id="panel-elsewhere" role="tabpanel">Elsewhere</div>
</body>
</html>
