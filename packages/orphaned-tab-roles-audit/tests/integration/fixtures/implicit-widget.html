<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>tabs and panels with no declared association</title></head>
<body>
	<div role="tablist">
		<button id="tab-a" role="tab" aria-selected="true">A</button>
		<button id="tab-b" role="tab" aria-selected="false">B</button>
	</div>
	<div id="panel-a" role="tabpanel">A</div>
	<div id="panel-b" role="tabpanel" hidden>B</div>
</body>
</html>
