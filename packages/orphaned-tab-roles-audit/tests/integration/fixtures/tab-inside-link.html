<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>tab roles inside navigation links</title></head>
<body>
	<nav>
		<ul id="section-nav" role="tablist">
			<li role="presentation"><a href="/dogs?sort=new"><span id="nav-dogs" role="tab" aria-selected="true">Dogs</span></a></li>
			<li role="presentation"><a href="https://elsewhere.test/cats"><span id="nav-cats" role="tab" aria-selected="false">Cats</span></a></li>
		</ul>
	</nav>
</body>
</html>
