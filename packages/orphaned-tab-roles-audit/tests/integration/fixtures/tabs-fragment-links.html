<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>fragment tab anchors</title></head>
<body>
	<div role="tablist">
		<a id="tab-a" role="tab" href="#panel-a">A</a>
		<a id="tab-b" role="tab" href="#panel-b">B</a>
	</div>
	<div id="panel-a" role="tabpanel">A</div>
	<div id="panel-b" role="tabpanel" hidden>B</div>
</body>
</html>
