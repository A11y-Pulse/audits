<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>tabs wired to each other's panels</title></head>
<body>
	<div role="tablist">
		<button id="tab-a" role="tab" aria-controls="panel-b">A</button>
		<button id="tab-b" role="tab" aria-controls="panel-a">B</button>
	</div>
	<div id="panel-a" role="tabpanel">A</div>
	<div id="panel-b" role="tabpanel" hidden>B</div>
</body>
</html>
