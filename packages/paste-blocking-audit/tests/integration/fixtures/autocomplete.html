<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
</head>
<body>
<main>
	<h1>Sign in</h1>
	<form id="login" method="post" action="/login" autocomplete="off">
		<label for="email">Email address</label>
		<input id="email" type="email" name="email">

		<label for="password">Password</label>
		<input id="password" type="password" name="password" autocomplete="off">

		<button type="submit">Sign in</button>
	</form>

	<h2>Members</h2>
	<form id="members" method="post" action="/login">
		<label for="member">Member number</label>
		<input id="member" type="text" name="login" autocomplete="username">

		<label for="member-password">Password</label>
		<input id="member-password" type="password" name="password" autocomplete="new-password">

		<button type="submit">Log in</button>
	</form>
</main>
</body>
</html>
