<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
</head>
<body>
<main>
	<h1>Sign in</h1>
	<form id="login" method="post" action="/login">
		<label for="username">Username</label>
		<input id="username" type="text" name="username" autocomplete="username" value="jane">

		<label for="password">Password</label>
		<input id="password" type="password" name="password" autocomplete="current-password" value="hunter2">

		<button type="submit">Log in</button>
	</form>
</main>
<script>
	// Both fields take over the paste and write the text in later, as a state update that waits on
	// a validation step would: the password after 120ms, the username after 400ms.
	const writeLater = (id, delay) => {
		const field = document.getElementById(id);

		field.addEventListener("paste", (event) => {
			event.preventDefault();
			const text = event.clipboardData.getData("text/plain");

			setTimeout(() => {
				field.value = text;
			}, delay);
		});
	};

	writeLater("password", 120);
	writeLater("username", 400);
</script>
</body>
</html>
