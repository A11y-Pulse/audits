<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>carousel</title>
	<style>
		html, body { margin: 0; }
		.rail {
			display: flex;
			overflow-x: auto;
			scroll-snap-type: x mandatory;
			width: 100%;
		}
		.slide {
			flex: 0 0 280px;
			scroll-snap-align: start;
			height: 80px;
			margin-right: 8px;
			background: #ddd;
		}
	</style>
</head>
<body>
	<div class="rail">
		<div class="slide">One</div>
		<div class="slide">Two</div>
		<div class="slide">Three</div>
		<div class="slide">Four</div>
		<div class="slide">Five</div>
		<div class="slide">Six</div>
	</div>
	<p>A scroll-snap rail that stays inside the viewport.</p>
</body>
</html>
