<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>layout table</title>
	<style>
		html, body { margin: 0; }
		table { width: 1000px; }
		td { padding: 1rem; }
	</style>
</head>
<body>
	<table id="layout" role="presentation">
		<tr>
			<td>Wide layout table used for positioning, not data.</td>
			<td>Second column that forces horizontal scroll at 320px.</td>
		</tr>
	</table>
</body>
</html>
