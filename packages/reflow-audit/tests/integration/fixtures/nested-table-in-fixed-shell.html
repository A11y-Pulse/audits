<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>nested table in fixed shell</title>
	<style>
		html, body { margin: 0; }
		#shell { width: 1000px; }
		table { width: 900px; }
		td, th { white-space: nowrap; padding: 0.5rem; }
	</style>
</head>
<body>
	<div id="shell">
		<table id="stats">
			<thead>
				<tr>
					<th>Region</th>
					<th>Q1</th>
					<th>Q2</th>
					<th>Q3</th>
					<th>Q4</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td>North</td>
					<td>100</td>
					<td>200</td>
					<td>300</td>
					<td>400</td>
				</tr>
			</tbody>
		</table>
	</div>
</body>
</html>
