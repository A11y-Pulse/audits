<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>responsive reflow</title>
	<style>
		html, body { margin: 0; }
		main { max-width: 100%; padding: 1rem; }
		p { overflow-wrap: anywhere; }
	</style>
</head>
<body>
	<main>
		<h1>Fluid layout</h1>
		<p>This page reflows at 320 CSS pixels without horizontal scrolling.</p>
	</main>
</body>
</html>
