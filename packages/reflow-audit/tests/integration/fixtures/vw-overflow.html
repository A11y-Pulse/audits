<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>vw overflow</title>
	<style>
		html, body { margin: 0; }
		/* Overlay scrollbars make `width: 100vw` a no-op in headless Chromium.
		   332px is 12px past 320, inside the 2-20px gutter band. */
		.band { width: 332px; height: 40px; background: #f5f5f5; }
	</style>
</head>
<body>
	<div class="band">Gutter-band overflow (12px).</div>
</body>
</html>
