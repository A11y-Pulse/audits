<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>wide data table</title>
	<style>
		html, body { margin: 0; }
		td, th { white-space: nowrap; padding: 0.5rem; }
	</style>
</head>
<body>
	<table id="stats">
		<thead>
			<tr>
				<th>Region</th>
				<th>Q1 revenue</th>
				<th>Q2 revenue</th>
				<th>Q3 revenue</th>
				<th>Q4 revenue</th>
				<th>YoY change</th>
				<th>Notes</th>
			</tr>
		</thead>
		<tbody>
			<tr>
				<td>Northern district office</td>
				<td>1,234,567</td>
				<td>1,345,678</td>
				<td>1,456,789</td>
				<td>1,567,890</td>
				<td>+12.4%</td>
				<td>Includes seasonal adjustment</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
