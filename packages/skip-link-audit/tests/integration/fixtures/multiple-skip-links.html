<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>multiple skip links</title></head>
<body>
	<a href="#main">Skip to content</a>
	<a href="#nav">Skip to navigation</a>
	<main id="main" tabindex="-1">
		<h1>Main content</h1>
	</main>
	<nav id="nav" tabindex="-1">
		<a href="/about">About</a>
	</nav>
</body>
</html>
