<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>leftover words that are also ordinary words</title></head>
<body>
	<fieldset>
		<legend>Die Erde ist rund</legend>
		<input id="quiz-true" type="radio" name="quiz" aria-label="True">
		<input id="quiz-false" type="radio" name="quiz" aria-label="False">
	</fieldset>
	<button id="run" type="button" aria-label="Test"><svg width="20" height="20" aria-hidden="true"><rect width="20" height="20"/></svg></button>
	<input id="caption" type="text" placeholder="Label">
	<button id="leftover" type="button" aria-label="undefined"><svg width="20" height="20" aria-hidden="true"><rect width="20" height="20"/></svg></button>
</body>
</html>
