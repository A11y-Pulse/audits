<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>role words</title></head>
<body>
	<button id="disclaimer" type="button" aria-label="Disclaimer button">ⓘ</button>
	<div id="custom-checkbox" role="checkbox" aria-checked="false" tabindex="0" aria-label="custom checkbox"></div>
	<button id="open-menu" type="button">Open menu</button>
	<p>Found a problem? <a id="report" href="/report">Report a broken link</a></p>
</body>
</html>
