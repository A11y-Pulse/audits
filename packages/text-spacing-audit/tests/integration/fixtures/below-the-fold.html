<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Text spacing finding far down the page</title>
		<style>
			body {
				margin: 0;
				font: 16px/20px sans-serif;
			}
			.spacer {
				height: 3000px;
			}
			.card {
				width: 30rem;
				height: 40px;
				overflow: hidden;
			}
		</style>
	</head>
	<body>
		<div class="spacer"></div>
		<div class="card" id="card">
			Free delivery on every order this week.<br />
			Offer ends on Sunday at midnight.
		</div>
		<div class="spacer"></div>
	</body>
</html>
