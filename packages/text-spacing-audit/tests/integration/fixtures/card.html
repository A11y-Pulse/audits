<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Text spacing product card</title>
		<style>
			body {
				margin: 16px;
				font: 16px/20px sans-serif;
			}
			.card {
				width: 40rem;
				height: 80px;
				overflow: hidden;
				border: 1px solid #999;
			}
			.card h3,
			.card p {
				margin: 0;
				font: inherit;
			}
			.card a {
				display: block;
			}
		</style>
	</head>
	<body>
		<article class="card" id="card">
			<h3 id="name">Trail running shoes</h3>
			<p id="summary">Lightweight, with a grippy sole.</p>
			<p id="stock">In stock and ready to ship.</p>
			<a id="more" href="/shoes">View details</a>
		</article>
	</body>
</html>
