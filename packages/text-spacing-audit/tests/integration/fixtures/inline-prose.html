<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Text spacing prose with inline links</title>
		<style>
			body {
				margin: 16px;
				font: 16px/1.4 sans-serif;
			}
			article {
				width: 14rem;
			}
		</style>
	</head>
	<body>
		<article>
			<p id="note">
				<strong>Note:</strong>
				<a href="/terms">read our terms and conditions</a> first, then
				<a href="/privacy">review the privacy policy and cookie notice</a> before you
				<em>create an account</em> or <a href="/contact">get in touch with the support team</a>.
			</p>
			<p>
				Orders placed before <strong>two in the afternoon</strong> are sent the same day by
				<a href="/delivery">tracked next-day delivery</a>.
			</p>
		</article>
	</body>
</html>
