<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Text spacing passing</title>
		<style>
			body {
				font: 16px/1.5 sans-serif;
				max-width: 40rem;
				margin: 2rem;
			}
			.card {
				min-height: 8rem;
				padding: 1rem;
			}
		</style>
	</head>
	<body>
		<article class="card">
			<p id="copy">
				A spacious layout that can grow when line height, letter spacing, and
				word spacing increase. The card uses min-height rather than a fixed
				clipping box, so text remains readable under WCAG 1.4.12 overrides.
			</p>
		</article>
	</body>
</html>
