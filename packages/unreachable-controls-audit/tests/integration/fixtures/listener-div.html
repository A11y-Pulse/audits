<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>click listeners on divs</title>
<style>body { margin: 0; padding: 16px; font: 16px/1.5 sans-serif; } .pointer { cursor: pointer; }</style></head><body>
<h1>Tents</h1>
<div id="buy" class="pointer">Buy now</div>
<div id="details">More details</div>
<p id="copy">Free delivery on orders over $200.</p>
<button id="real" type="button">Add to basket</button>
<script>
	document.getElementById("buy").addEventListener("click", () => {});
	document.getElementById("details").addEventListener("click", () => {});
</script>
</body></html>
