<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>click target in a shadow root</title>
<style>body { margin: 0; padding: 16px; font: 16px/1.5 sans-serif; }</style></head><body>
<product-gallery id="gallery"></product-gallery>
<a id="home" href="#home">Home</a>
<script>
	customElements.define(
		"product-gallery",
		class extends HTMLElement {
			constructor() {
				super();
				this.attachShadow({ mode: "open" }).innerHTML =
					'<div class="zoom" style="cursor: pointer" onclick="void 0">Zoom</div><p>Summit 3, front view</p>';
			}
		},
	);
</script>
</body></html>
