<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
  body { background: #fff; }
</style></head><body>
  <!-- A focusable element inside an open shadow root with a real (outline)
       focus indicator. The style stage must descend the shadow root to snapshot
       it, otherwise this could only ever be caught by the pixel-diff fallback. -->
  <div id="host"></div>
  <script>
    const host = document.getElementById("host");
    const root = host.attachShadow({ mode: "open" });
    root.innerHTML = `
      <style>
        button { outline: none; }
        button:focus { outline: 3px solid #2563eb; }
      </style>
      <button>Shadow button</button>
    `;
  </script>
</body></html>
